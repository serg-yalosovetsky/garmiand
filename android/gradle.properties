org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
garmiand.backendUrl=https://garmiand.sergnet.pp.ua
# backendToken is passed at build time via GARMIAND_BACKEND_TOKEN env so it
# stays out of git (BWS secret GARMIAND_BACKEND_TOKEN, project hermes). Do NOT
# add a garmiand.backendToken property — an empty value would shadow the env.

# Remote logging to Grafana Loki (reader-android token pattern).
# Token is passed at build time via GARMIAND_LOKI_TOKEN env so it stays out of
# git (BWS secret GARMIAND_LOKI_TOKEN, project hermes). Do NOT add a
# garmiand.lokiToken property here — an empty value would shadow the env var.
# Header name must match the nginx SSO-bypass rule in front of Loki.
garmiand.lokiUrl=https://loki.sergnet.pp.ua
garmiand.lokiTokenHeader=X-Reader-Token
